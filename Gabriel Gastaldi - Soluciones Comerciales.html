/* Layout: una columna mobile first; desde 860px, citas con foto y casos en dos columnas. Fondo azul noche que se apaga a negro con dos triángulos suaves. */
:root{
  --navy:#0d0830;
  --ink:#04030c;
  --or:#e68253;
  --or-2:#f0a27e;
  --tx:#f3ede6;
  --mu:rgba(243,237,230,.70);
  --mu-2:rgba(243,237,230,.48);
  --ln:rgba(243,237,230,.13);
  --card:rgba(255,255,255,.045);
  --card-2:rgba(255,255,255,.075);
  --or-soft:rgba(230,130,83,.13);
  --f-d:Montserrat,"Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-b:Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bar:3.4rem;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--bar) + 12px);background:var(--ink)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;position:relative;min-height:100vh;min-height:100dvh;font:400 1rem/1.62 var(--f-b);color:var(--tx);
  background:linear-gradient(168deg,var(--navy) 0px,#08061f 520px,#050413 1050px,var(--ink) 1500px) var(--ink);
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
.tri{position:absolute;inset:0 0 auto;height:min(1400px,100%);pointer-events:none;z-index:0;overflow:hidden}
.tri::before,.tri::after{content:"";position:absolute}
.tri::before{top:var(--bar);left:-20%;width:130%;height:760px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 85%);clip-path:polygon(0 0,100% 0,36% 100%)}
.tri::after{top:240px;right:-10%;width:90%;height:900px;background:linear-gradient(200deg,rgba(230,130,83,.07),rgba(230,130,83,0) 70%);clip-path:polygon(100% 0,100% 100%,8% 70%)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:6px}
strong,b{font-weight:700;color:var(--tx)}

/* barra de migas */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);border-bottom:1px solid var(--ln)}
#bar .in{max-width:1080px;margin:0 auto;min-height:var(--bar);display:flex;align-items:center;gap:.75rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bc{display:flex;align-items:center;gap:.15rem;min-width:0;flex:1;overflow:hidden;font:500 .78rem/1 var(--f-m);letter-spacing:.02em}
#bc a{color:var(--or);text-decoration:none;padding:.75rem .3rem;white-space:nowrap;border-radius:6px}
#bc a:hover{color:var(--or-2)}
#bc .cur{color:var(--tx);padding:.75rem .3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#bc .sep{color:var(--mu-2)}
.pill{flex:none;display:inline-flex;align-items:center;gap:.4rem;background:var(--or);color:var(--navy);font:700 .8rem/1 var(--f-b);text-decoration:none;padding:.6rem .9rem;border-radius:99px}
.pill:hover{background:var(--or-2)}

main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 4rem}
.wrap{max-width:760px}
h1,h2,h3{font-family:var(--f-d);text-wrap:balance;margin:0}
h2{font-size:clamp(1.65rem,6.2vw,2.45rem);font-weight:800;line-height:1.08;letter-spacing:-.02em}
.eyebrow{font:500 .92rem/1.25 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--or)}
.sec{padding-top:clamp(3.2rem,9vw,5.5rem)}
.sec-h{display:grid;gap:.6rem;margin-bottom:1.6rem}
.lead{color:var(--mu);font-size:1.02rem;max-width:60ch;margin:0}

/* inicio */
.hero{min-height:calc(100svh - var(--bar) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;padding-block:2.5rem 3rem}
.hx{position:relative}
.hme{position:absolute;right:-6px;top:0;width:38vw;max-width:200px;aspect-ratio:3/4.4;margin:0;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.hme img{width:100%;height:auto}
.hero .eyebrow,.hero h1{padding-right:min(36vw,190px)}
.hero h1{font-weight:900;font-size:clamp(2.5rem,11.5vw,5rem);line-height:.98;letter-spacing:-.035em}
.hero h1 .dash{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero h1 .h1-sub{display:block;color:var(--or);font-weight:800;font-size:.56em;letter-spacing:-.02em;margin-top:.3em}
.hero .eyebrow{margin-bottom:1.3rem}
.sub{margin:1.6rem 0 0;font-size:clamp(1rem,3.9vw,1.12rem);color:var(--mu);max-width:50ch}
.sub strong{color:var(--tx)}
.horse{display:block;margin-top:1rem;font-style:italic;font-weight:700;color:var(--tx);font-size:clamp(.95rem,3.7vw,1.06rem);line-height:1.45}
.term{background:none;border:0;padding:0;cursor:pointer;color:var(--or);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.term:hover{color:var(--or-2)}
.cta{margin-top:2.2rem;display:grid;gap:.75rem;max-width:420px}
.btn{display:flex;justify-content:center;align-items:center;gap:.6rem;min-height:56px;border-radius:14px;border:0;cursor:pointer;background:var(--or);color:var(--navy);font:800 1.02rem/1 var(--f-b);text-decoration:none;padding:0 1.4rem;transition:transform .15s ease,background .15s ease}
.btn:hover{background:var(--or-2)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:600}
.btn.ghost:hover{background:var(--card-2)}
.btn svg{width:18px;height:18px;flex:none}

/* citas + foto */
.quotes{display:grid;gap:1.1rem}
.q{margin:0;padding:1.1rem 1.15rem 1rem;background:var(--card);border:1px solid var(--ln);border-radius:16px}
.q p{margin:0;font-weight:600;font-size:1.02rem;line-height:1.45}
.q p::before{content:"“";color:var(--or);font-weight:900;margin-right:.08em}
.q p::after{content:"”";color:var(--or);font-weight:900;margin-left:.04em}
.q cite{display:block;margin-top:.6rem;font:500 .72rem/1.3 var(--f-m);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--or)}
.q cite small{color:var(--mu-2);letter-spacing:.04em;text-transform:none;font-size:.95em}
.q.big{background:none;border:0;padding:0 0 .4rem}
.q.big p{font-size:clamp(1.3rem,5.6vw,1.85rem);font-weight:800;line-height:1.2;letter-spacing:-.015em}
.q.end{background:none;border:0;padding:.6rem 0 0}
.q.end p{font-size:clamp(1.12rem,4.6vw,1.42rem);font-weight:600;line-height:1.25;letter-spacing:-.01em}

/* qué hago */
.steps{display:grid;gap:.75rem;counter-reset:s}
.step{position:relative;display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;align-items:start;padding:1.15rem;border-radius:16px;background:var(--card);border:1px solid var(--ln)}
.step .n{grid-row:span 2;font:900 2.1rem/1 var(--f-d);color:var(--or);min-width:1.6ch}
.step h3{font-size:1.15rem;font-weight:800}
.step h3 small{display:block;font:500 .7rem/1.4 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--mu-2);margin-bottom:.15rem}
.step p{margin:0;color:var(--mu);font-size:.96rem}

/* método */
.method{display:grid;gap:0}
.m{padding-block:1rem 1.6rem;border-top:1px solid var(--ln)}
.track{container-type:inline-size;position:relative;height:148px;margin-bottom:.6rem}
.ico{position:absolute;left:calc(50% - 44px);top:calc(50% - 44px);width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(230,130,83,.28),rgba(230,130,83,.08));border:1px solid rgba(230,130,83,.45);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:ocho 10s linear infinite}

}

const SEC=["como","que","metodo","casos","revops","tambien","sabe","hablemos"];
let cur="";
function toTop(){try{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;document.getElementById("top").scrollIntoView({block:"start"})}catch(e){}}
function route(tok,push){
  tok=tok||"inicio";
  if(tok=="hablemos"&&document.getElementById("hablemos")){document.getElementById("hablemos").scrollIntoView({behavior:"smooth"});return}
  const isCase=C.some(c=>c.id==tok),isSec=SEC.includes(tok);
  const view=isCase?tok:(tok=="inicio"?"inicio":"portfolio");
  const from=cur;
  if(view!=cur){
    if(view=="inicio")home();else if(view=="portfolio")portfolio();else caso(view);
    cur=view;
  }
  if(view!=from&&!isSec)toTop();
  if(push){try{history.pushState({t:tok},"","#"+tok)}catch(e){}}
  requestAnimationFrame(()=>{
    let el=null;
    if(isSec)el=document.getElementById(tok);
    else if(view=="portfolio"&&C.some(c=>c.id==from))el=document.getElementById("card-"+from);
    if(el){el.scrollIntoView({block:"start",behavior:(from==view?"smooth":"auto")})}
    else toTop();
  });
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){e.preventDefault();route(g.dataset.go,true);return}
  const t=e.target.closest("[data-t]");
  if(t){document.getElementById("dt").textContent=T[t.dataset.t][0];document.getElementById("dp").textContent=T[t.dataset.t][1];dlg.showModal();return}
  const cp=e.target.closest("[data-copy]");
  if(cp){const v=cp.dataset.copy;
    const sel=()=>{const s=cp.previousElementSibling,r=document.createRange();r.selectNodeContents(s);const w=getSelection();w.removeAllRanges();w.addRange(r);toast("Seleccionado: copialo con tu teclado")};
    try{navigator.clipboard.writeText(v).then(()=>toast("Copiado"),sel)}catch(err){sel()}}
});
dlg.addEventListener("click",e=>{if(e.target===dlg||e.target.closest(".x"))dlg.close()});
addEventListener("popstate",e=>route((e.state&&e.state.t)||location.hash.slice(1),false));
let start="";try{start=location.hash.slice(1)}catch(e){}
route(start,false);
</script>
